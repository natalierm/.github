name: Bug
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Prod
        - Local docker compose
    validations:
      required: true
